services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Local demo can run with safe defaults; deployment should still provide
      # a real .env with secrets.
      - path: .env
        required: false
    environment:
      KNOWLEDGE_BASE_DIR: /knowledge/vinuni
      DATABASE_URL: sqlite:///./data/app.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./data:/app/data
      - ./metadata:/knowledge/vinuni:ro
    restart: unless-stopped
    healthcheck:
      # Readiness is intentionally stricter than liveness: it also fails when
      # the approved dataset is unavailable or past its review date.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
